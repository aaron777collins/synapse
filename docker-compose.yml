services:
  synapse:
    build: ./synapse
    container_name: synapse
    command: ["node", "server/index.js", "--vault", "/vault", "--host", "0.0.0.0"]
    volumes:
      - ./vault:/vault
    environment:
      - PORT=5173
    restart: unless-stopped
    networks:
      - caddy

networks:
  caddy:
    external: true
